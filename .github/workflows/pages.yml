name: Deploy Bonds Studio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Type-check and build
        run: pnpm run check && pnpm run build
      - name: Publish standalone HTML scenes
        run: |
          mkdir -p ./dist/scenes
          cp -R ./web/scenes/. ./dist/scenes/
          if [ -f ./web/earth-frame.html ]; then cp ./web/earth-frame.html ./dist/earth-frame.html; fi
          if [ -f ./web/bonds-studio.css ]; then cp ./web/bonds-studio.css ./dist/bonds-studio.css; fi
          if [ -f ./web/bonds-studio.js ]; then cp ./web/bonds-studio.js ./dist/bonds-studio.js; fi
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
