<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Bonds Studio</title>
</head>
<body>
<script>
(function () {
  var base = "/Bonds-Studio/";
  var target = location.pathname + location.search + location.hash;
  if (target.indexOf(base) === 0) target = target.slice(base.length - 1);
  var query = "?redirect=" + encodeURIComponent(target || "/");
  location.replace(base + query);
})();
</script>
</body>
</html>
