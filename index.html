<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bonds Studio</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            display: flex;
            flex-direction: column;
            font-family: Arial, sans-serif;
        }
        header {
            background-color: #222;
            color: white;
            padding: 1rem;
            text-align: center;
            font-size: 2rem;
            flex-shrink: 0;
        }
        main {
            flex-grow: 1;
            position: relative;
            overflow: hidden;
        }
        main img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        footer {
            background-color: #222;
            color: white;
            text-align: center;
            padding: 0.75rem;
            flex-shrink: 0;
            font-size: 1rem;
        }
    </style>
</head>
<body>
    <header>Bonds Studio</header>
    <main>
        <img src="https://images.unsplash.com/photo-1519389950473-47ba0277781c?auto=format&fit=crop&w=1350&q=80" alt="Code Image" />
    </main>
    <footer>Bonds Studio © 2027. All Rights Reserved</footer>
</body>
</html>
