<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bonanza Road Scene · Bonds Studio</title><style>body{margin:0;background:#07131d;color:#eaf3f4;font:16px system-ui,sans-serif}main{width:min(1100px,100%);margin:auto;padding:24px;box-sizing:border-box}.hero{border:1px solid #315466;border-radius:22px;padding:28px;background:linear-gradient(145deg,#0b1d29,#102f3b)}.eyebrow{letter-spacing:.18em;color:#77d9ed;font-size:11px}.grid{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;margin-top:18px}.viewport{min-height:480px;border-radius:18px;border:1px solid #315466;background:radial-gradient(circle at 50% 45%,#285a64,#0a1822 52%,#030a10);display:grid;place-items:center;position:relative;overflow:hidden}.pin{width:24px;height:24px;border-radius:50%;background:#70e5ef;box-shadow:0 0 0 10px #70e5ef22,0 0 45px #70e5ef}.controls{border:1px solid #315466;border-radius:18px;padding:20px;background:#0b1c28}.shot{padding:13px;border:1px solid #254555;border-radius:12px;margin:8px 0;background:#0e2531}.shot strong{display:block}.meta{color:#9db4bd;font-size:13px}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}button{border:1px solid #4a7380;border-radius:10px;padding:12px 16px;background:#123442;color:#fff;font-weight:700}@media(max-width:760px){.grid{grid-template-columns:1fr}.viewport{min-height:360px}}
</style></head><body><main><section class="hero"><div class="eyebrow">BONDS STUDIO · LOCATION SCENE</div><h1>3500 E Bonanza Rd</h1><p>Las Vegas, Nevada 89110 · 36.173803, -115.097758</p><div class="actions"><button onclick="parent.location.href='../'">Back to Studio</button><button onclick="document.getElementById('play').click()">Preview scene</button></div></section><div class="grid"><section class="viewport"><div class="pin" title="3500 E Bonanza Rd"></div></section><section class="controls"><div class="eyebrow">30 SEC · 30 FPS · LOOP</div><h2>Animated scene</h2><p class="meta">Earth descent → aerial approach → street-level establishing shot → location orbit → hero pullback.</p><div id="shots"></div><button id="play">▶ Play storyboard</button><p id="status" class="meta"></p></section></div></main><script>const shots=[['00–06s','Orbital descent'],['06–13s','Aerial approach'],['13–21s','Street-level establish'],['21–27s','Location orbit'],['27–30s','Hero pullback']];document.getElementById('shots').innerHTML=shots.map(x=>`<div class="shot"><strong>${x[0]}</strong>${x[1]}</div>`).join('');document.getElementById('play').onclick=()=>{document.getElementById('status').textContent='Storyboard preview armed. Connect the WebGL Earth renderer and terrain provider to render the camera path.'};</script></body></html>
