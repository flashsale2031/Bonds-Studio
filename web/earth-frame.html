<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Earth Module</title><style>*{box-sizing:border-box}html,body{margin:0;min-width:0;overflow:hidden}body{background:#07131d;color:#e9f3f7;font:14px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.earth{position:relative;min-height:100vh;overflow:hidden;padding:22px;background:radial-gradient(circle at 70% 35%,#15364a 0,#081923 45%,#040d14 100%)}.stars{position:absolute;inset:0;background-image:radial-gradient(circle,#d7edf5 1px,transparent 1.5px);background-size:83px 71px;opacity:.42}.top{position:relative;z-index:2;display:flex;justify-content:space-between;gap:16px;align-items:flex-start}.eyebrow{font-size:11px;letter-spacing:.2em;color:#8ca9b7}.title{margin:5px 0 0;font:500 25px Georgia,serif}.mode{padding:12px 18px;border:1px solid #385366;border-radius:24px;background:#091b27cc;color:#bca3ff}.mode b{display:block;margin-top:3px;font-size:19px}.orbital{position:absolute;z-index:1;width:min(65vw,610px);height:min(65vw,610px);min-width:340px;min-height:340px;right:8%;top:50%;transform:translateY(-45%);border-radius:50%;box-shadow:0 0 0 18px #15394c66,0 0 70px #4cbde333;background:url('../earth-blue-marble.png') center/cover no-repeat}.orbital:after{content:"";position:absolute;inset:-18px;border:1px solid #68d6f055;border-radius:50%;transform:rotate(22deg)}.panel{position:absolute;z-index:3;left:28px;top:98px;width:min(310px,calc(100% - 56px));padding:18px;border:1px solid #29495b;border-radius:18px;background:#081d2ad9;box-shadow:0 25px 55px #0008;backdrop-filter:blur(10px)}label{display:block;color:#a5bbc7;margin:0 0 13px;font-size:12px}.select{display:flex;justify-content:space-between;align-items:center;margin-top:6px;padding:11px 12px;border:1px solid #31566a;border-radius:10px;color:#eef7fa;background:#0b2433}.status{margin:5px 0 14px;color:#9ff0cb;font-size:19px}.actions{display:grid;gap:8px}.actions button,.location button{border:1px solid #28617b;border-radius:10px;padding:10px;background:#0c2636;color:#6de2ff}.location{position:absolute;z-index:3;left:28px;right:28px;bottom:20px;display:flex;gap:10px;padding:12px;border:1px solid #23495b;border-radius:15px;background:#071a26dd}.location .select{flex:1;margin:0}.location button{background:#6fe3ff;color:#07131d;font-weight:700}.badge{position:absolute;z-index:3;right:26px;bottom:26px;padding:13px 18px;border:1px solid #29495b;border-radius:18px;background:#081d2ad9}.badge b{display:block;color:#66ddff;font-size:19px}.hint{position:absolute;z-index:3;right:28px;bottom:88px;color:#89a3b0;font-size:11px;max-width:180px;text-align:right}@media(max-width:700px){.earth{padding:16px}.mode{padding:9px 13px}.title{font-size:20px}.orbital{width:82vw;height:82vw;right:-7%;top:53%;min-width:300px;min-height:300px}.panel{left:16px;top:88px;width:min(285px,calc(100% - 32px));padding:14px}.location{left:16px;right:16px;bottom:14px}.badge,.hint{display:none}}@media(max-width:460px){.panel{top:82px;width:calc(100% - 32px)}.orbital{top:55%;opacity:.9}.location{display:grid;grid-template-columns:1fr auto}.location button{min-width:92px}.top{align-items:center}}
</style></head><body><main class="earth"><div class="stars"></div><div class="top"><div><div class="eyebrow">ORBITAL FIELD / EARTH SYSTEM</div><div class="title">Earth-centered workspace</div></div><div class="mode">MODE<b>Making</b></div></div><div class="orbital" aria-label="Earth globe"></div><section class="panel"><label>SIMULATION TIME<div class="select">Nov 7, 2028, 08:13 AM <span>⌄</span></div></label><label>PLAYBACK<div class="select">1 day / second <span>⌄</span></div></label><label>CENTER OBJECT<div class="select">Earth <span>⌄</span></div></label><div class="status">Earth centered</div><div class="actions"><button>Pause simulation</button><button>Reset 10-year process</button><button>Explore view</button><button>Reset view</button></div></section><div class="hint">Drag to rotate · wheel and pinch to zoom<br>Keplerian orbital simulation</div><div class="badge">IN MOTION<b>∞ ideas</b></div><div class="location"><div class="select">New York, United States <span>⌄</span></div><button>Street View ↗</button></div></main></body></html>
